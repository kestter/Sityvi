<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>სიტყვი</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>სიტყვი</h1>
    <div class="puzzle-info">
      <span id="puzzle-number">#1</span> · <span>ყოველდღიური თავსატეხი</span>
    </div>
  </header>

  <main>
    <div id="message" class="message" aria-live="polite"></div>
    <div id="board" class="board"></div>
    <div id="result" class="result hidden">
      <p id="result-title" class="result-title"></p>
      <p class="result-word"><span id="result-word"></span></p>
      <p id="result-meaning" class="result-meaning"></p>
    </div>
    <div class="countdown-box">
      <span>შემდეგი სიტყვა:</span>
      <span id="countdown" class="countdown">--:--:--</span>
    </div>
    <div id="keyboard" class="keyboard"></div>
  </main>

  <script src="main.js"></script>
</body>
</html>
